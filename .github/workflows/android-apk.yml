name: Build Paw & Petal Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build installable APK with Expo EAS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate Paw & Petal brand images
        run: |
          npm install --no-save sharp
          node -e "const s=require('sharp'); Promise.all([s('assets/paw-petal-logo.svg').resize(1024,1024).png().toFile('assets/icon.png'),s('assets/paw-petal-logo.svg').resize(900,900).png().toFile('assets/logo.png'),s('assets/paw-petal-splash.svg').resize(1080,2340).png().toFile('assets/splash.png')]).catch(e=>{console.error(e);process.exit(1)})"
      - name: Link EAS project
        run: npx --yes eas-cli@latest init --force --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Build APK on Expo
        run: npx --yes eas-cli@latest build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
